[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adb-mlkit"
version = "0.1.2"
description = "On-device multilingual ML Kit OCR from Python over ADB"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["adb", "android", "ocr", "mlkit", "vietnamese"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = ["uiautomator2>=3.0,<4", "Pillow>=10"]

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://github.com/zidonghua-source/ADB-MLKit"
Repository = "https://github.com/zidonghua-source/ADB-MLKit"
Issues = "https://github.com/zidonghua-source/ADB-MLKit/issues"
Documentation = "https://github.com/zidonghua-source/ADB-MLKit/blob/main/README.md"

[tool.setuptools.package-data]
adb_mlkit = ["assets/*.apk", "assets/helper.json"]

[project.scripts]
adb-mlkit = "adb_mlkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
