name: Publish Python package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: Package index (configure matching Trusted Publisher first)
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.target.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Resolve target index
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.target }}" >> $GITHUB_OUTPUT
          else
            echo "name=pypi" >> $GITHUB_OUTPUT
          fi
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import re; print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package version $PKG_VERSION" >&2
            exit 1
          fi
          echo "Publishing version $PKG_VERSION"
      - name: Restore stable helper debug signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HELPER_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo 'Set HELPER_DEBUG_KEYSTORE_BASE64 to a stable Android debug keystore before publishing.' >&2
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build and test
        run: |
          sh android/gradlew -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          python -m pip install -e '.[dev]'
          python -m unittest discover -s tests -v
          python scripts/prepare_package.py
          python -m build
          python scripts/verify_wheel.py dist/*.whl
          python -m twine check dist/*
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: publish-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build.outputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: publish-distributions
          path: dist/
      - name: Publish to TestPyPI
        if: needs.build.outputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: needs.build.outputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1